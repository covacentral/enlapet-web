<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>enlapet - Animador de Logo para Marketing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a; /* Slate 900 por defecto */
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      transition: background-color 0.3s ease;
    }

    /* Contenedor del Logo */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Icono de Huella flotante con degradado */
    .logo-icon-bg {
      width: 150px;
      height: 150px;
      border-radius: 46px;
      background: linear-gradient(135deg, hsl(350, 90%, 60%) 0%, hsl(20, 95%, 55%) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 50px rgba(244, 63, 94, 0.35);
      animation: floatLoop 3s ease-in-out infinite;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      color: white;
    }

    /* Texto enlapet */
    .logo-text {
      font-size: 4rem;
      font-weight: 900;
      background: linear-gradient(135deg, hsl(350, 95%, 50%), hsl(20, 95%, 50%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      letter-spacing: -2px;
      text-transform: lowercase;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.1));
    }

    /* Keyframes para un rebote/flotado súper suave */
    @keyframes floatLoop {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-20px) rotate(4deg) scale(1.02);
      }
    }

    /* Panel de Control flotante para Grabación */
    .control-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-dark { background-color: #0f172a; color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-light { background-color: #f8fafc; color: #0f172a; border: 1px solid #ddd; }
    .btn-green { background-color: #00ff00; color: black; }
    
    .panel-title {
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.8rem;
      margin-right: 8px;
    }
  </style>
</head>
<body>

  <!-- Contenedor Animado -->
  <div class="logo-container">
    <div class="logo-icon-bg">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="4" r="2" />
        <circle cx="18" cy="8" r="2" />
        <circle cx="20" cy="16" r="2" />
        <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
      </svg>
    </div>
    <h1 class="logo-text">enlapet</h1>
  </div>

  <!-- Panel de Control de Fondo -->
  <div class="control-panel">
    <span class="panel-title">Fondo para Grabación:</span>
    <button class="btn btn-dark" onclick="changeBg('#0f172a')">Oscuro</button>
    <button class="btn btn-light" onclick="changeBg('#f8fafc')">Claro</button>
    <button class="btn btn-green" onclick="changeBg('#00ff00')">Chroma (Verde)</button>
  </div>

  <script>
    function changeBg(color) {
      document.documentElement.style.setProperty('--bg-color', color);
    }
  </script>
</body>
</html>
