<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>enlapet - Grabador de Reels (1080x1920)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a; /* Slate 900 */
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #1e293b; /* Fondo exterior */
      font-family: 'Outfit', sans-serif;
      overflow: auto;
    }

    /* Contenedor del Reel (Forzado a 1080x1920) */
    .reel-canvas {
      width: 1080px;
      height: 1920px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      border: 4px solid #334155;
      /* Escalar visualmente si la pantalla es más pequeña que 1920px de alto */
      transform: scale(0.4);
      transform-origin: center center;
      transition: background-color 0.3s ease;
    }

    /* Ajustar escala automática en pantallas pequeñas */
    @media (max-height: 950px) {
      .reel-canvas {
        transform: scale(0.4);
      }
    }
    @media (max-height: 800px) {
      .reel-canvas {
        transform: scale(0.35);
      }
    }
    @media (max-height: 700px) {
      .reel-canvas {
        transform: scale(0.3);
      }
    }

    /* Contenedor del Logo centralizado y agrandado para formato vertical */
    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }

    /* Icono de Huella flotante con degradado */
    .logo-icon-bg {
      width: 280px;
      height: 280px;
      border-radius: 86px;
      background: linear-gradient(135deg, hsl(350, 90%, 60%) 0%, hsl(20, 95%, 55%) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 40px 90px rgba(244, 63, 94, 0.45);
      animation: floatLoop 3s ease-in-out infinite;
    }

    .logo-icon {
      width: 150px;
      height: 150px;
      color: white;
    }

    /* Texto enlapet */
    .logo-text {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, hsl(350, 95%, 50%), hsl(20, 95%, 50%));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      letter-spacing: -4px;
      text-transform: lowercase;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.15));
    }

    /* Keyframes para un rebote/flotado súper suave */
    @keyframes floatLoop {
      0%, 100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }
      50% {
        transform: translateY(-40px) rotate(4deg) scale(1.03);
      }
    }

    /* Panel de Control flotante */
    .control-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 24px;
      border-radius: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-dark { background-color: #0f172a; color: white; border: 1px solid rgba(255, 255, 255, 0.2); }
    .btn-light { background-color: #f8fafc; color: #0f172a; border: 1px solid #ddd; }
    .btn-green { background-color: #00ff00; color: black; }
    
    .panel-title {
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.85rem;
      margin-right: 8px;
    }

    .instructions {
      position: absolute;
      top: 60px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- Lienzo forzado a resolución de Instagram Reel -->
  <div class="reel-canvas" id="canvas">
    <div class="instructions">Instagram Reel Loop (1080x1920)</div>
    
    <div class="logo-container">
      <div class="logo-icon-bg">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="2" />
          <circle cx="18" cy="8" r="2" />
          <circle cx="20" cy="16" r="2" />
          <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
        </svg>
      </div>
      <h1 class="logo-text">enlapet</h1>
    </div>
  </div>

  <!-- Panel de Control de Fondo -->
  <div class="control-panel">
    <span class="panel-title">Fondo del Reel:</span>
    <button class="btn btn-dark" onclick="changeBg('#0f172a')">Oscuro</button>
    <button class="btn btn-light" onclick="changeBg('#f8fafc')">Claro</button>
    <button class="btn btn-green" onclick="changeBg('#00ff00')">Chroma Key</button>
  </div>

  <script>
    function changeBg(color) {
      document.documentElement.style.setProperty('--bg-color', color);
    }
  </script>
</body>
</html>
