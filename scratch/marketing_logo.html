<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>enlapet - Exportador de Reel a Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      color: white;
      font-family: 'Outfit', sans-serif;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    /* Contenedor de previsualización a escala */
    .preview-container {
      position: relative;
      width: 360px;  /* 1080 / 3 */
      height: 640px; /* 1920 / 3 */
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      border: 3px solid #334155;
      border-radius: 18px;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000;
    }

    /* Panel de controles */
    .controls {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .btn-record {
      background: linear-gradient(135deg, hsl(350, 90%, 60%) 0%, hsl(20, 95%, 55%) 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
    }

    .btn-record:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .bg-selector {
      display: flex;
      gap: 8px;
    }

    .bg-btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .bg-btn.active {
      border-color: hsl(350, 90%, 60%);
      background-color: #334155;
    }

    .status-text {
      text-align: center;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 5px;
    }

    .instructions {
      max-width: 360px;
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h2>enlapet Reel Generator</h2>
    
    <!-- Previsualización en tiempo real del Canvas (Escala 1:3 en la interfaz) -->
    <div class="preview-container">
      <canvas id="exportCanvas" width="1080" height="1920"></canvas>
    </div>

    <!-- Panel de controles -->
    <div class="controls">
      <div>
        <label style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; display: block;">Color de Fondo:</label>
        <div class="bg-selector">
          <button class="bg-btn active" onclick="setBg('#0f172a', this)">Oscuro</button>
          <button class="bg-btn" onclick="setBg('#f8fafc', this)">Claro</button>
          <button class="bg-btn" onclick="setBg('#00ff00', this)">Chroma Key</button>
        </div>
      </div>

      <button id="recordBtn" class="btn btn-record" onclick="startRecording()">
        Exportar Video Reel (15s)
      </button>
      <div id="status" class="status-text">Listo para exportar</div>
    </div>

    <div class="instructions">
      * Al exportar, el script procesará la animación exacta de 15 segundos en resolución vertical nativa 1080x1920 (9:16) y descargará un archivo de video en tu carpeta de descargas de forma automática.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('exportCanvas');
    const ctx = canvas.getContext('2d');
    const recordBtn = document.getElementById('recordBtn');
    const statusText = document.getElementById('status');

    let currentBgColor = '#0f172a';
    let isRecording = false;

    // SVG Path del PawPrint oficial de enlapet (Lucide v1.17.0)
    const pawPath = new Path2D("M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z");

    function setBg(color, element) {
      currentBgColor = color;
      document.querySelectorAll('.bg-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    // Dibujar cada frame
    function draw(time) {
      // Limpiar y fondo completo
      ctx.fillStyle = currentBgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Calcular animación de vaivén (Fórmula seno suave)
      const amplitude = 40; 
      const bounce = Math.sin(time * 0.0025) * amplitude;

      // El logo y el texto ocupan el 90% del ancho del canvas (1080 * 0.9 = 972px)
      const containerWidth = 972;
      const centerX = canvas.width / 2;

      ctx.save();
      // Aplicar flotado vertical al contenedor completo
      ctx.translate(0, bounce);

      // 1. Dibujar el contenedor cuadrado del logo con degradado
      const squareSize = 360;
      const squareX = centerX - squareSize / 2;
      const squareY = 550; // Posición base vertical

      // Crear gradiente de marca
      const grad = ctx.createLinearGradient(squareX, squareY, squareX + squareSize, squareY + squareSize);
      grad.addColorStop(0, 'hsl(350, 90%, 60%)');
      grad.addColorStop(1, 'hsl(20, 95%, 55%)');

      // Dibujar rectángulo redondeado
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(squareX, squareY, squareSize, squareSize, 96);
      ctx.fill();

      // Sombra del contenedor
      ctx.shadowColor = 'rgba(244, 63, 94, 0.4)';
      ctx.shadowBlur = 80;
      ctx.shadowOffsetY = 20;

      // 2. Dibujar el Icono de la Huella (Delineada) en blanco dentro del cuadro
      ctx.save();
      ctx.translate(squareX + (squareSize - 180) / 2, squareY + (squareSize - 180) / 2);
      ctx.scale(7.5, 7.5); // Escalar al tamaño deseado (180px de alto aprox)
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.fillStyle = 'none';

      // Círculos superiores
      ctx.beginPath();
      ctx.arc(11, 4, 2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(18, 8, 2, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(20, 16, 2, 0, Math.PI * 2);
      ctx.stroke();

      // Almohadilla central
      ctx.stroke(pawPath);
      ctx.restore();

      // Restaurar sombras para evitar que afecte al texto
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // 3. Dibujar Texto "enlapet" con Degradado
      const textY = squareY + squareSize + 180;
      const textGrad = ctx.createLinearGradient(centerX - 250, textY - 80, centerX + 250, textY);
      textGrad.addColorStop(0, 'hsl(350, 95%, 50%)');
      textGrad.addColorStop(1, 'hsl(20, 95%, 50%)');

      ctx.fillStyle = textGrad;
      ctx.font = '900 150px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('enlapet', centerX, textY);

      // 4. Dibujar Eslogan
      ctx.fillStyle = currentBgColor === '#f8fafc' ? '#334155' : 'rgba(255, 255, 255, 0.9)';
      ctx.font = '600 38px "Outfit", sans-serif';
      
      const sloganY = textY + 140;
      wrapText(ctx, "Identificación inteligente para los que no pueden hablar.", centerX, sloganY, 800, 54);

      ctx.restore();

      requestAnimationFrame(draw);
    }

    // Función auxiliar para envolver texto largo
    function wrapText(context, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let currentY = y;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = context.measureText(testLine);
        let testWidth = metrics.width;
        if (testWidth > maxWidth && n > 0) {
          context.fillText(line, x, currentY);
          line = words[n] + ' ';
          currentY += lineHeight;
        } else {
          line = testLine;
        }
      }
      context.fillText(line, x, currentY);
    }

    // Iniciar loop de animación
    requestAnimationFrame(draw);

    // Exportador de video en tiempo real utilizando MediaRecorder
    function startRecording() {
      if (isRecording) return;
      isRecording = true;
      recordBtn.disabled = true;

      // Usar captureStream del Canvas
      const stream = canvas.captureStream(30); // 30 FPS
      
      // Intentar usar formatos soportados por el navegador
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm;codecs=vp8' };
      }
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const mediaRecorder = new MediaRecorder(stream, options);
      const chunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) {
          chunks.push(e.data);
        }
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        
        // Descargar automáticamente
        const a = document.createElement('a');
        a.href = url;
        a.download = 'enlapet_reel_intro.webm';
        document.body.appendChild(a);
        a.click();
        
        // Limpieza y reinicio de estado
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        isRecording = false;
        recordBtn.disabled = false;
        recordBtn.innerText = 'Exportar Video Reel (15s)';
        statusText.innerText = '¡Exportado con éxito!';
      };

      // Iniciar grabación de 15 segundos
      mediaRecorder.start();
      
      let secondsLeft = 15;
      statusText.innerText = `Grabando y renderizando... ${secondsLeft}s restantes`;
      
      const interval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          statusText.innerText = `Grabando y renderizando... ${secondsLeft}s restantes`;
        } else {
          clearInterval(interval);
          mediaRecorder.stop();
        }
      }, 1000);
    }
  </script>
</body>
</html>
